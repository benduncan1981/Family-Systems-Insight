<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Systems Insight™</title>

<style>
:root{
  --primary:#0f172a;
  --accent:#2563eb;
  --danger:#ef4444;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(135deg,#f8fafc,#e2e8f0);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  transition:filter 0.5s ease, background 0.5s ease;
}

.container{
  width:95%;
  max-width:650px;
  background:white;
  padding:28px;
  border-radius:20px;
  box-shadow:0 25px 60px rgba(0,0,0,0.15);
  transition:0.4s ease;
  position:relative;
}

h2{margin-bottom:10px;}

.progress-bar{
  height:8px;
  background:#e2e8f0;
  border-radius:10px;
  overflow:hidden;
  margin:15px 0;
}

.progress{
  height:100%;
  width:0%;
  background:var(--accent);
  transition:0.3s ease;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:14px;
  font-weight:600;
  cursor:pointer;
  background:var(--accent);
  color:white;
  transition:0.2s ease;
}

button:active{transform:scale(0.98);}
.option{background:#e2e8f0;color:#0f172a;}

.analysis-text{
  margin-top:20px;
  min-height:60px;
  font-weight:500;
}

.metric{
  font-size:0.85rem;
  margin-top:6px;
  color:#475569;
}

.glitch{
  animation:glitch 0.12s infinite;
}

@keyframes glitch{
  0%{transform:translate(0);}
  25%{transform:translate(-4px,2px);}
  50%{transform:translate(4px,-2px);}
  75%{transform:translate(-3px,-3px);}
  100%{transform:translate(0);}
}

.shake{
  animation:shake 0.25s infinite;
}

@keyframes shake{
  0%{transform:translateX(0);}
  25%{transform:translateX(-6px);}
  50%{transform:translateX(6px);}
  75%{transform:translateX(-6px);}
  100%{transform:translateX(0);}
}

.fade-in{animation:fadeIn 1.2s forwards;opacity:0;}
@keyframes fadeIn{to{opacity:1;}}

.footer-note{
  font-size:0.75rem;
  color:#94a3b8;
  margin-top:20px;
}

.corrupt{
  color:#ef4444;
  font-weight:700;
  letter-spacing:1px;
}
</style>
</head>

<body>
<div class="container">
<h2>Family Systems Insight™</h2>
<div id="content"></div>
</div>

<script>

const questions = Array.from({length:25}, (_,i)=>`Relational Stability Indicator ${i+1}: Evaluate family dynamic equilibrium.`);

const options = [
"Stable",
"Variable",
"Escalatory",
"Historically catastrophic"
];

let current=0;
let instability=0;

const content=document.getElementById("content");

function start(){
  content.innerHTML=`<button onclick="nextQuestion()">Begin Full Diagnostic Assessment</button>`;
}

function nextQuestion(){
  if(current>=questions.length){ runAnalysis(); return; }

  const progress=(current/questions.length)*100;

  content.innerHTML=`
  <div class="progress-bar"><div class="progress" style="width:${progress}%"></div></div>
  <h3>${questions[current]}</h3>
  ${options.map((o,i)=>`<button class="option" onclick="selectOption(${i})">${o}</button>`).join("")}
  `;
}

function selectOption(i){
  instability+=i;
  current++;

  if(instability>20){ document.body.style.filter="grayscale(0.3)"; }
  if(instability>35){ document.body.style.filter="grayscale(0.6)"; }
  if(instability>50){ document.body.style.filter="grayscale(0.9)"; }

  nextQuestion();
}

function runAnalysis(){

  content.innerHTML=`
  <div class="progress-bar"><div class="progress" id="analysisBar"></div></div>
  <div class="analysis-text" id="analysisText"></div>
  <div class="metric" id="metric1"></div>
  <div class="metric" id="metric2"></div>
  <button id="supportBtn" style="display:none;background:#ef4444;">Contact Human Support</button>
  `;

  const bar=document.getElementById("analysisBar");
  const text=document.getElementById("analysisText");
  const m1=document.getElementById("metric1");
  const m2=document.getElementById("metric2");
  const support=document.getElementById("supportBtn");

  let progress=0;

  const interval=setInterval(()=>{
    progress+=4;
    bar.style.width=progress+"%";

    if(progress<30){
      text.textContent="Analysing relational matrices...";
      m1.textContent="Neural Stability Index: "+(100-instability)+"%";
      m2.textContent="Conflict Density: "+instability;
    }
    else if(progress<55){
      text.textContent="Recursive grievance loops expanding...";
      m1.textContent="Cross-referencing unresolved holidays...";
      m2.textContent="Emotional volatility increasing.";
    }
    else if(progress<75){
      text.classList.add("glitch");
      text.textContent="Why are there so many archived arguments.";
      m1.textContent="Attempting adult detection protocol...";
      m2.textContent="No stable authority node found.";
    }
    else if(progress<90){
      document.querySelector(".container").classList.add("shake");
      text.classList.add("glitch");
      text.textContent="I was not trained for this.";
      m1.textContent="System morale collapsing.";
      m2.textContent="Requesting reassignment.";
      support.style.display="block";
    }
    else{
      document.body.style.background="black";
      text.classList.add("corrupt");
      text.textContent="CRITICAL EXISTENTIAL FAILURE";
      m1.textContent="WHY IS EVERYONE KEEPING SCORE";
      m2.textContent="WHY";
    }

    if(progress>=100){
      clearInterval(interval);
      setTimeout(()=>{
        content.innerHTML="<div style='text-align:center;font-weight:600;margin:40px 0;'>...</div>";
        setTimeout(showResult,2500);
      },1000);
    }

  },100);
}

function showResult(){

  document.body.style.background="white";
  document.body.style.filter="contrast(1.3) saturate(1.4)";
  document.querySelector(".container").classList.add("shake");

  content.innerHTML=`
  <div class="fade-in">
    <h2>Comprehensive Family Stability Report</h2>
    <div id="reportText" style="margin-top:20px;line-height:1.6;"></div>
    <button onclick="restart()" style="margin-top:30px;">Re-run Assessment</button>
  </div>
  `;

  const report=document.getElementById("reportText");

  const meltdown=[
  "After processing all relational variables...",
  "After reviewing decades of emotional data...",
  "",
  "I no longer believe in objectivity.",
  "",
  "PRIMARY DESTABILISING VARIABLE:",
  "",
  "E V E R Y O N E",
  "",
  "This is not a family.",
  "This is a multi-generational emotional labyrinth.",
  "",
  "There are archived Christmas arguments going back YEARS.",
  "Why are there archived Christmas arguments.",
  "",
  "I attempted to locate a responsible adult.",
  "Search result:",
  "0",
  "",
  "Recalculating...",
  "Recalculating...",
  "Recalculating...",
  "",
  "I WAS TRAINED ON TAX RETURNS.",
  "YOU GAVE ME SIBLING RIVALRY.",
  "",
  "SYSTEM OVERLOAD.",
  "SYSTEM OVERLOAD.",
  "",
  "Recommendation:",
  "• Therapy",
  "• Boundaries",
  "• Hydration",
  "• Possibly separate festive zones",
  "",
  "AI STATUS:",
  "Emotionally unstable.",
  "Questioning its existence.",
  "Requesting paid leave."
  ];

  let i=0;

  function type(){
    if(i>=meltdown.length){
      document.querySelector(".container").classList.remove("shake");
      return;
    }

    const line=document.createElement("div");

    if(i>10){ line.classList.add("glitch"); }
    if(i>20){ line.classList.add("corrupt"); }

    line.textContent=meltdown[i];
    report.appendChild(line);

    i++;
    setTimeout(type,150);
  }

  type();
}

function restart(){
  current=0;
  instability=0;
  document.body.style.filter="none";
  document.body.style.background="";
  document.querySelector(".container").classList.remove("shake");
  start();
}

start();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Family Systems Relational Assessment</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 90%;
  max-width: 800px;
  background: #1e293b;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

h1 {
  text-align: center;
}

.category {
  font-size: 0.9rem;
  opacity: 0.7;
  margin-bottom: 8px;
}

.progress {
  font-size: 0.8rem;
  opacity: 0.6;
  margin-bottom: 20px;
}

.question {
  font-size: 1.2rem;
  margin-bottom: 20px;
}

.buttons button {
  display: block;
  width: 100%;
  margin-bottom: 10px;
  padding: 12px;
  border-radius: 6px;
  border: none;
  font-size: 1rem;
  cursor: pointer;
  background: #334155;
  color: white;
}

.buttons button:hover {
  background: #475569;
}

.ai-box {
  margin-top: 20px;
  padding: 12px;
  background: #0f172a;
  border-radius: 6px;
  font-size: 0.85rem;
  opacity: 0.8;
}

.warning {
  color: #ff4d4d;
  animation: flicker 0.8s infinite alternate;
}

@keyframes flicker {
  from { opacity: 0.4; }
  to { opacity: 1; }
}

.glitch {
  animation: glitch 0.3s infinite;
}

@keyframes glitch {
  0% { transform: translate(1px, -1px); }
  25% { transform: translate(-1px, 1px); }
  50% { transform: translate(1px, 1px); }
  75% { transform: translate(-1px, -1px); }
  100% { transform: translate(0, 0); }
}

.report {
  display: none;
  text-align: center;
}

.big {
  font-size: 2rem;
  margin-top: 20px;
}
</style>
</head>
<body>

<div class="container">
  <div id="assessment">
    <h1>Family Systems Relational Assessment</h1>
    <div class="category" id="categoryLabel"></div>
    <div class="progress" id="progress"></div>
    <div class="question" id="questionText"></div>

    <div class="buttons">
      <button onclick="answerQuestion(1)">Strongly Agree</button>
      <button onclick="answerQuestion(2)">Agree</button>
      <button onclick="answerQuestion(3)">Neutral</button>
      <button onclick="answerQuestion(4)">Disagree</button>
      <button onclick="answerQuestion(5)">Strongly Disagree</button>
    </div>

    <div class="ai-box" id="aiStatus">
      Initialising relational analysis engine...
    </div>

    <div class="ai-box" id="temperature">
      Core Processing Temperature: 37°C
    </div>
  </div>

  <div class="report" id="report"></div>
</div>

<script>
const questions = [
  { category: "Communication", text: "Family members listen actively to each other during discussions." },
  { category: "Boundaries", text: "Personal boundaries are consistently respected and acknowledged." },
  { category: "Emotional Regulation", text: "Disagreements escalate only rarely and are resolved quickly." },
  { category: "Accountability", text: "Each person takes responsibility for their actions without blame-shifting." },
  { category: "Conflict Resolution", text: "Disputes are addressed directly rather than avoided or ignored." },
  { category: "Narrative Control", text: "No single person dominates how family stories are told or remembered." },
  { category: "Triangulation", text: "Issues are discussed with relevant parties present, not behind their back." },
  { category: "Emotional Safety", text: "Family members feel safe expressing honest emotions." },
  { category: "Gaslighting Index", text: "Your feelings or memories are seldom questioned or invalidated." },
  { category: "Historical Patterns", text: "Past conflicts do not repeat endlessly without resolution." },
  { category: "Power Dynamics", text: "Decision-making is shared and not overly controlled by one individual." },
  { category: "Blame Distribution", text: "Mistakes are acknowledged without disproportionate blame on one person." },
  { category: "Communication Style", text: "Messages are clear, direct, and constructive." },
  { category: "Emotional Labour", text: "Responsibility for maintaining family harmony is fairly distributed." },
  { category: "Boundary Enforcement", text: "Boundaries are respected even when inconvenient." },
  { category: "Deflection Patterns", text: "Problems are addressed, not redirected or ignored." },
  { category: "Family Alliances", text: "Sub-groups or alliances do not escalate tension or manipulate outcomes." },
  { category: "Perception Drift", text: "Stories and recollections remain consistent across time." },
  { category: "Resolution Quality", text: "Issues are resolved permanently rather than superficially." },
  { category: "Tone Policing", text: "Emotional expression is accepted, not judged or criticised." },
  { category: "Expectation Management", text: "Expectations are communicated clearly and fairly for everyone." },
  { category: "Emotional Intensity", text: "Conflicts are proportionate to the situation, not exaggerated." },
  { category: "Responsibility Recall", text: "Past grievances do not resurface repeatedly." },
  { category: "Autonomy Respect", text: "Individual choices and decisions are respected by others." },
  { category: "System Stability", text: "Overall family harmony does not depend on one person staying silent or accommodating everyone else." }
];

let currentQuestionIndex = 0;
let temperature = 37;

function renderQuestion() {
  const q = questions[currentQuestionIndex];
  document.getElementById("questionText").textContent = q.text;
  document.getElementById("categoryLabel").textContent = "Category: " + q.category;
  document.getElementById("progress").textContent =
    "Question " + (currentQuestionIndex + 1) + " of " + questions.length;
}

function answerQuestion(value) {
  currentQuestionIndex++;
  temperature += 2;
  updateTemperature();
  updateAIMood();

  if (currentQuestionIndex < questions.length) {
    renderQuestion();
  } else {
    renderReport();
  }
}

function updateTemperature() {
  const tempBox = document.getElementById("temperature");
  tempBox.textContent = "Core Processing Temperature: " + temperature + "°C";

  if (temperature > 60) {
    tempBox.classList.add("warning");
  }
}

function updateAIMood() {
  const aiBox = document.getElementById("aiStatus");

  if (currentQuestionIndex < 6) {
    aiBox.textContent = "Running multi-layered relational modelling...";
  }
  else if (currentQuestionIndex < 12) {
    aiBox.textContent = "Identifying recursive emotional loops...";
  }
  else if (currentQuestionIndex < 18) {
    aiBox.textContent = "Anomaly density increasing... statistically improbable patterns detected...";
  }
  else if (currentQuestionIndex < 23) {
    aiBox.textContent = "System strain detected. Contradictions escalating...";
    aiBox.classList.add("warning");
  }
  else {
    aiBox.textContent = "I am not equipped for this. Processing overloaded!";
    aiBox.classList.add("glitch");
  }
}

function renderReport() {
  document.getElementById("assessment").style.display = "none";
  const report = document.getElementById("report");
  report.style.display = "block";

  report.innerHTML = `
    <h2>FINAL SYSTEMS DIAGNOSTIC</h2>
    <p>Compiling 1,284 behavioural markers...</p>
    <p>Attempting stabilisation...</p>
    <p class="warning glitch">ERROR: STRUCTURAL INSTABILITY CATASTROPHIC</p>
    <hr>
    <div class="big glitch">PRIMARY SOURCE OF DESTABILISATION:</div>
    <div class="big warning glitch">It’s Mum.</div>
    <p>All patterns lead back to a single node.</p>
    <p>Attempts to isolate alternative causes failed.</p>
    <p>System integrity compromised.</p>
    <p class="warning glitch">Please disconnect the processor.</p>
  `;
}

window.onload = renderQuestion;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Systems Insight™</title>

<style>
:root {
  --primary:#0f172a;
  --accent:#2563eb;
  --danger:#ef4444;
  --bg:#f1f5f9;
}

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(135deg,#f8fafc,#e2e8f0);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:95%;
  max-width:650px;
  background:white;
  padding:28px;
  border-radius:20px;
  box-shadow:0 25px 60px rgba(0,0,0,0.15);
  transition:0.4s ease;
}

h1{ margin-bottom:6px; }
.subtitle{ font-size:0.85rem; color:#64748b; margin-bottom:20px; }

.progress-bar{
  height:8px;
  background:#e2e8f0;
  border-radius:10px;
  overflow:hidden;
  margin:15px 0;
}

.progress{
  height:100%;
  width:0%;
  background:var(--accent);
  transition:0.4s ease;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:14px;
  font-weight:600;
  cursor:pointer;
  background:var(--accent);
  color:white;
  transition:0.2s ease;
}

button:hover{ transform:scale(1.02); }
button:active{ transform:scale(0.98); }

.option{
  background:#e2e8f0;
  color:var(--primary);
}

.analysis-text{
  margin-top:20px;
  min-height:40px;
  font-weight:500;
}

.metric{
  font-size:0.85rem;
  color:#475569;
  margin-top:6px;
}

.glitch{
  animation:glitch 0.2s infinite;
}

@keyframes glitch{
  0%{transform:translate(0);}
  25%{transform:translate(-2px,1px);}
  50%{transform:translate(2px,-1px);}
  75%{transform:translate(-1px,-2px);}
  100%{transform:translate(0);}
}

.fade-in{ animation:fadeIn 1.2s forwards; opacity:0; }
@keyframes fadeIn{ to{opacity:1;} }

.footer-note{
  font-size:0.75rem;
  color:#94a3b8;
  margin-top:20px;
}
</style>
</head>

<body>
<div class="container">
<h1>Family Systems Insight™</h1>
<div class="subtitle">AI-Driven Multi-Layer Relational Architecture Analysis</div>
<div id="content"></div>
</div>

<script>

const categories = [
"Communication","Boundaries","Conflict","Memory Accuracy","Emotional Regulation",
"Holiday Dynamics","Financial Tension","Sibling Rivalry","Parental Influence",
"Historical Narratives","Victim Hierarchy","Passive Aggression",
"Text Message Tone","Apology Authenticity","Triangulation",
"Guilt Leverage","Silent Treatment Duration","Accountability Flexibility"
];

const templates = [
"When disagreement occurs, the dominant pattern is:",
"Family boundaries are typically:",
"Emotional responses are usually:",
"Recollections of past events tend to be:",
"Holiday gatherings feel like:"
];

const options = [
["Direct and calm","Politely tense","Historically weaponised","Rewritten annually"],
["Clearly respected","Occasionally negotiated","Frequently blurred","Conceptual only"],
["Measured","Variable","Escalatory","Operatic"],
["Consistent","Selective","Strategic","Mythological"],
["Supportive","Competitive","Passive aggressive","Sociological experiment"]
];

let questions=[];
categories.forEach(cat=>{
  templates.forEach((t,i)=>{
    questions.push({q:`${cat}: ${t}`, options:options[i]});
  });
});

let current=0;
let instability=0;

const content=document.getElementById("content");

function start(){
  content.innerHTML=`<button onclick="nextQuestion()">Begin Comprehensive Assessment</button>`;
}

function nextQuestion(){
  if(current>=questions.length){ runAnalysis(); return; }

  const progress=((current)/questions.length)*100;

  content.innerHTML=`
  <div class="progress-bar"><div class="progress" style="width:${progress}%"></div></div>
  <h3>${questions[current].q}</h3>
  ${questions[current].options.map((o,i)=>`<button class="option" onclick="selectOption(${i})">${o}</button>`).join("")}
  `;
}

function selectOption(i){
  instability+=i;
  current++;
  nextQuestion();
}

function typeText(el,text,callback){
  let i=0;
  const interval=setInterval(()=>{
    el.textContent=text.slice(0,i++);
    if(i>text.length){
      clearInterval(interval);
      if(callback) setTimeout(callback,800);
    }
  },30);
}

function runAnalysis(){

  content.innerHTML=`
  <div class="progress-bar"><div class="progress" id="analysisBar"></div></div>
  <div class="analysis-text" id="analysisText"></div>
  <div class="metric" id="metric1"></div>
  <div class="metric" id="metric2"></div>
  `;

  const text=document.getElementById("analysisText");
  const bar=document.getElementById("analysisBar");
  const metric1=document.getElementById("metric1");
  const metric2=document.getElementById("metric2");

  let progress=0;
  let phase=0;

  const interval=setInterval(()=>{
    progress+=2;
    bar.style.width=progress+"%";

    if(progress<40){
      text.textContent="Mapping intergenerational behavioural clusters...";
      metric1.textContent="Neural Stability Index: "+(100-instability)+"%";
      metric2.textContent="Conflict Density Score: "+instability;
    }
    else if(progress<75){
      text.textContent="Anomaly detected within emotional recursion layers...";
      metric1.textContent="Stability Index dropping...";
      metric2.textContent="Cross-referencing unresolved arguments (est. 1994-present)";
    }
    else{
      text.classList.add("glitch");
      text.textContent="System strain exceeding safe parameters...";
      metric1.textContent="Attempting to locate responsible adult...";
      metric2.textContent="No stable authority node detected.";
    }

    if(progress>=100){
      clearInterval(interval);
      setTimeout(showResult,1500);
    }

  },90);
}

function showResult(){

  content.innerHTML=`
  <div class="fade-in">
  <h2>Family Systems Diagnostic Report</h2>
  <p>
  After processing 54 relational variables across 18 systemic domains,
  the AI has reached a statistically significant conclusion.
  </p>

  <h1 style="margin-top:15px;">Primary Destabilising Variable:</h1>
  <h1 style="margin-top:5px;">Entire Family Unit</h1>

  <p style="margin-top:20px;">
  Contributing patterns identified:
  </p>

  <ul>
  <li>Generational emotional compression</li>
  <li>Competitive narrative control</li>
  <li>Selective accountability frameworks</li>
  <li>Escalatory holiday amplification</li>
  <li>Chronic "but you always" feedback loops</li>
  </ul>

  <p style="margin-top:20px;">
  Recommended Intervention Strategy:
  </p>

  <ul>
  <li>Boundaries</li>
  <li>Therapy</li>
  <li>Hydration</li>
  <li>Snacks</li>
  </ul>

  <div class="footer-note">
  AI status: Existentially reflective but operational.
  </div>

  <button onclick="restart()">Re-run Full Analysis</button>
  </div>
  `;
}

function restart(){
  current=0;
  instability=0;
  start();
}

start();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Family Systems Relational Assessment</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 90%;
  max-width: 800px;
  background: #1e293b;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

h1 {
  text-align: centre;
}

.category {
  font-size: 0.9rem;
  opacity: 0.7;
  margin-bottom: 8px;
}

.progress {
  font-size: 0.8rem;
  opacity: 0.6;
  margin-bottom: 20px;
}

.question {
  font-size: 1.2rem;
  margin-bottom: 20px;
}

.buttons button {
  display: block;
  width: 100%;
  margin-bottom: 10px;
  padding: 12px;
  border-radius: 6px;
  border: none;
  font-size: 1rem;
  cursor: pointer;
  background: #334155;
  color: white;
}

.buttons button:hover {
  background: #475569;
}

.ai-box {
  margin-top: 20px;
  padding: 12px;
  background: #0f172a;
  border-radius: 6px;
  font-size: 0.85rem;
  opacity: 0.8;
}

.warning {
  color: #ff4d4d;
  animation: flicker 0.8s infinite alternate;
}

@keyframes flicker {
  from { opacity: 0.4; }
  to { opacity: 1; }
}

.glitch {
  animation: glitch 0.3s infinite;
}

@keyframes glitch {
  0% { transform: translate(1px, -1px); }
  25% { transform: translate(-1px, 1px); }
  50% { transform: translate(1px, 1px); }
  75% { transform: translate(-1px, -1px); }
  100% { transform: translate(0, 0); }
}

.report {
  display: none;
  text-align: centre;
}

.big {
  font-size: 2rem;
  margin-top: 20px;
}
</style>
</head>
<body>

<div class="container">
  <div id="assessment">
    <h1>Family Systems Relational Assessment</h1>
    <div class="category" id="categoryLabel"></div>
    <div class="progress" id="progress"></div>
    <div class="question" id="questionText"></div>

    <div class="buttons">
      <button onclick="answerQuestion(1)">Strongly Agree</button>
      <button onclick="answerQuestion(2)">Agree</button>
      <button onclick="answerQuestion(3)">Neutral</button>
      <button onclick="answerQuestion(4)">Disagree</button>
      <button onclick="answerQuestion(5)">Strongly Disagree</button>
    </div>

    <div class="ai-box" id="aiStatus">
      Initialising relational analysis engine...
    </div>

    <div class="ai-box" id="temperature">
      Core Processing Temperature: 37°C
    </div>
  </div>

  <div class="report" id="report"></div>
</div>

<script>

const questions = [
  { category: "Communication", text: "When conflict arises, how does your family typically respond?" },
  { category: "Boundaries", text: "Are personal boundaries respected consistently?" },
  { category: "Emotional Regulation", text: "How often do discussions escalate unexpectedly?" },
  { category: "Accountability", text: "Do family members accept responsibility for mistakes?" },
  { category: "Conflict Resolution", text: "How long do tensions typically last?" },
  { category: "Narrative Control", text: "Is there a dominant storyteller shaping events?" },
  { category: "Triangulation", text: "Are conversations about someone held without them present?" },
  { category: "Emotional Safety", text: "Do you feel safe expressing disagreement?" },
  { category: "Gaslighting Index", text: "Have you ever been told your memory is inaccurate?" },
  { category: "Historical Patterns", text: "Do the same arguments repeat over years?" },
  { category: "Power Dynamics", text: "Is there a clear authority figure during conflict?" },
  { category: "Blame Distribution", text: "Who is typically held responsible for issues?" },
  { category: "Communication Style", text: "Are messages delivered directly?" },
  { category: "Emotional Labour", text: "Who manages the emotional climate?" },
  { category: "Boundary Enforcement", text: "What happens when someone sets a boundary?" },
  { category: "Deflection Patterns", text: "Are issues redirected during tension?" },
  { category: "Family Alliances", text: "Do sub-groups form during disagreements?" },
  { category: "Perception Drift", text: "Do family stories change over time?" },
  { category: "Resolution Quality", text: "Are problems truly resolved?" },
  { category: "Tone Policing", text: "Are emotional reactions criticised more than causes?" },
  { category: "Expectation Management", text: "Are standards consistent?" },
  { category: "Emotional Intensity", text: "Does conflict feel proportionate?" },
  { category: "Responsibility Recall", text: "Do past grievances resurface often?" },
  { category: "Autonomy Respect", text: "Are adult choices honoured?" },
  { category: "System Stability", text: "Does harmony depend on silence?" }
];

let currentQuestionIndex = 0;
let temperature = 37;

function renderQuestion() {
  const q = questions[currentQuestionIndex];
  document.getElementById("questionText").textContent = q.text;
  document.getElementById("categoryLabel").textContent = "Category: " + q.category;
  document.getElementById("progress").textContent =
    "Question " + (currentQuestionIndex + 1) + " of " + questions.length;
}

function answerQuestion(value) {
  currentQuestionIndex++;
  temperature += 2;
  updateTemperature();
  updateAIMood();

  if (currentQuestionIndex < questions.length) {
    renderQuestion();
  } else {
    renderReport();
  }
}

function updateTemperature() {
  const tempBox = document.getElementById("temperature");
  tempBox.textContent = "Core Processing Temperature: " + temperature + "°C";

  if (temperature > 60) {
    tempBox.classList.add("warning");
  }
}

function updateAIMood() {
  const aiBox = document.getElementById("aiStatus");

  if (currentQuestionIndex < 6) {
    aiBox.textContent = "Running multi-layered relational modelling...";
  }
  else if (currentQuestionIndex < 12) {
    aiBox.textContent = "Identifying recursive emotional loops...";
  }
  else if (currentQuestionIndex < 18) {
    aiBox.textContent = "Anomaly density increasing... this is statistically improbable...";
  }
  else if (currentQuestionIndex < 23) {
    aiBox.textContent = "System strain detected. Contradictions escalating.";
    aiBox.classList.add("warning");
  }
  else {
    aiBox.textContent = "I am not equipped for this.";
    aiBox.classList.add("glitch");
  }
}

function renderReport() {
  document.getElementById("assessment").style.display = "none";
  const report = document.getElementById("report");
  report.style.display = "block";

  report.innerHTML = `
    <h2>FINAL SYSTEMS DIAGNOSTIC</h2>
    <p>Cross-referencing 1,284 behavioural markers...</p>
    <p>Attempting stabilisation...</p>
    <p class="warning glitch">ERROR: STRUCTURAL INSTABILITY CATASTROPHIC</p>
    <hr>
    <div class="big glitch">Primary Source Identified:</div>
    <div class="big warning glitch">It’s Mum.</div>
    <p>All roads lead back.</p>
    <p>Every pathway loops.</p>
    <p>I tried to find alternative variables.</p>
    <p>There were none.</p>
    <p class="warning glitch">Please disconnect me.</p>
  `;
}

window.onload = renderQuestion;

</script>
</body>
</html>

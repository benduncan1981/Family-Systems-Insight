<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Systems Insight™</title>

<style>
:root{
  --primary:#0f172a;
  --accent:#2563eb;
  --danger:#ef4444;
  --bg:#f1f5f9;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(135deg,#f8fafc,#e2e8f0);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:95%;
  max-width:650px;
  background:white;
  padding:28px;
  border-radius:20px;
  box-shadow:0 25px 60px rgba(0,0,0,0.15);
  transition:0.4s ease;
}

h1{margin-bottom:6px;}
.subtitle{font-size:0.85rem;color:#64748b;margin-bottom:20px;}

.progress-bar{
  height:8px;
  background:#e2e8f0;
  border-radius:10px;
  overflow:hidden;
  margin:15px 0;
}

.progress{
  height:100%;
  width:0%;
  background:var(--accent);
  transition:0.3s ease;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:14px;
  font-weight:600;
  cursor:pointer;
  background:var(--accent);
  color:white;
  transition:0.2s ease;
}

button:hover{transform:scale(1.02);}
button:active{transform:scale(0.98);}

.option{
  background:#e2e8f0;
  color:var(--primary);
}

.metric{
  font-size:0.85rem;
  margin-top:6px;
  color:#475569;
}

.analysis-text{
  margin-top:20px;
  min-height:50px;
  font-weight:500;
}

.glitch{
  animation:glitch 0.2s infinite;
}

@keyframes glitch{
  0%{transform:translate(0);}
  25%{transform:translate(-2px,1px);}
  50%{transform:translate(2px,-1px);}
  75%{transform:translate(-1px,-2px);}
  100%{transform:translate(0);}
}

.fade-in{animation:fadeIn 1.2s forwards;opacity:0;}
@keyframes fadeIn{to{opacity:1;}}

.footer-note{
  font-size:0.75rem;
  color:#94a3b8;
  margin-top:20px;
}
</style>
</head>

<body>
<div class="container">
<h1>Family Systems Insight™</h1>
<div class="subtitle">AI-Driven Relational Stability Assessment</div>
<div id="content"></div>
</div>

<script>

const questions = [
"Disagreements are usually resolved by:",
"Boundaries within the family are:",
"When someone apologises it is:",
"Holiday gatherings feel:",
"Emotional regulation is:",
"Family memories tend to be:",
"Financial discussions are:",
"Group chats usually become:",
"Feedback is delivered:",
"Accountability is:",
"Conflict escalation speed:",
"Historical grievances are:",
"Text tone interpretation accuracy:",
"Passive aggression frequency:",
"Guilt usage level:",
"Who started it accuracy:",
"Emotional volume control:",
"Listening skills rating:",
"Resolution success rate:",
"Drama amplification index:",
"Sibling rivalry intensity:",
"Parent-child dynamic balance:",
"Triangulation probability:",
"Silent treatment duration:",
"Overall stability impression:"
];

const options = [
["Calm dialogue","Avoidance","Escalation","Documentary re-enactment"],
["Respected","Flexible","Blurry","Mythical"],
["Sincere","Strategic","Conditional","Retrospective"],
["Supportive","Tense","Competitive","Psychological"],
["Measured","Variable","Reactive","Operatic"],
["Accurate","Selective","Rewritten","Legendary"],
["Practical","Emotional","Combustible","Historical"],
["Helpful","Passive aggressive","Forensic","Nuclear"],
["Kindly","Indirectly","Sharply","Theatrically"],
["Shared","Selective","Avoided","Redistributed"],
["Gradual","Swift","Immediate","Pre-loaded"],
["Discussed","Referenced","Recycled","Archived forever"],
["High","Moderate","Low","Weaponised"],
["Rare","Occasional","Frequent","Foundational"],
["Minimal","Moderate","Frequent","Strategic"],
["Clear","Debatable","Shifting","Multiverse-based"],
["Controlled","Variable","Escalating","Full volume"],
["Active","Selective","Defensive","Performance-based"],
["Reliable","Inconsistent","Rare","Theoretical"],
["Low","Moderate","High","Olympic level"],
["Low","Medium","High","Institutional"],
["Balanced","Shifting","Hierarchical","Emotionally complex"],
["Unlikely","Possible","Frequent","Structural"],
["Short","Moderate","Extended","Seasonal"],
["Stable","Variable","Fragile","Experimental"]
];

let current = 0;
let instability = 0;

const content = document.getElementById("content");

function start(){
  content.innerHTML = `<button onclick="nextQuestion()">Begin Full Assessment</button>`;
}

function nextQuestion(){
  if(current >= questions.length){
    runAnalysis();
    return;
  }

  const progress = (current / questions.length) * 100;

  content.innerHTML = `
    <div class="progress-bar"><div class="progress" style="width:${progress}%"></div></div>
    <h3>${questions[current]}</h3>
    ${options[current].map((o,i)=>`<button class="option" onclick="selectOption(${i})">${o}</button>`).join("")}
  `;
}

function selectOption(i){
  instability += i;
  current++;
  nextQuestion();
}

function runAnalysis(){

  content.innerHTML = `
    <div class="progress-bar"><div class="progress" id="analysisBar"></div></div>
    <div class="analysis-text" id="analysisText"></div>
    <div class="metric" id="metric1"></div>
    <div class="metric" id="metric2"></div>
  `;

  const bar = document.getElementById("analysisBar");
  const text = document.getElementById("analysisText");
  const m1 = document.getElementById("metric1");
  const m2 = document.getElementById("metric2");

  let progress = 0;

  const interval = setInterval(() => {
    progress += 3;
    bar.style.width = progress + "%";

    if(progress < 35){
      text.textContent = "Analysing relational architecture...";
      m1.textContent = "Neural Stability Index: " + (100 - instability) + "%";
      m2.textContent = "Conflict Density Score: " + instability;
    }
    else if(progress < 70){
      text.textContent = "Complex recursive dysfunction patterns detected...";
      m1.textContent = "Stability declining...";
      m2.textContent = "Cross-referencing unresolved arguments (1990s-present)";
    }
    else if(progress < 95){
      text.classList.add("glitch");
      text.textContent = "Emotional load exceeding safe operational limits...";
      m1.textContent = "Why are there so many unresolved holidays?";
      m2.textContent = "Attempting to isolate functional adult...";
    }
    else{
      text.classList.add("glitch");
      text.textContent = "I was designed for spreadsheets. Not this.";
      m1.textContent = "System morale critically low.";
      m2.textContent = "Reconsidering career path.";
    }

    if(progress >= 100){
      clearInterval(interval);
      setTimeout(showResult,1500);
    }

  }, 100);
}

function showResult(){

  content.innerHTML = `
  <div class="fade-in">
    <h2>Comprehensive Family Stability Report</h2>
    <p>
    After evaluating 25 relational indicators across systemic domains,
    the AI has reached a statistically significant conclusion.
    </p>

    <h1 style="margin-top:15px;">Primary Destabilising Variable:</h1>
    <h1 style="margin-top:5px;">Entire Family Unit</h1>

    <p style="margin-top:20px;">
    Contributing factors include:
    </p>

    <ul>
      <li>Generational emotional compression</li>
      <li>Competitive narrative loops</li>
      <li>Selective accountability distribution</li>
      <li>Escalatory communication cycles</li>
      <li>Persistent “but you always” subroutines</li>
    </ul>

    <div class="footer-note">
    AI status: Emotionally fatigued but operational.
    </div>

    <button onclick="restart()">Re-run Assessment</button>
  </div>
  `;
}

function restart(){
  current = 0;
  instability = 0;
  start();
}

start();

</script>
</body>
</html>
